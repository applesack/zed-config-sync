name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: zed-config
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: zed-config
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: zed-config
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: zed-config
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: zed-config.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation deps
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create archives
        run: |
          cd artifacts
          for dir in */; do
            target="${dir%/}"
            if [ -f "$target/zed-config" ]; then
              cp "$target/zed-config" zed-config
              tar czf "zed-config-${target}.tar.gz" zed-config
            elif [ -f "$target/zed-config.exe" ]; then
              cp "$target/zed-config.exe" zed-config.exe
              zip "zed-config-${target}.zip" zed-config.exe
            fi
          done

      - name: Generate changelog
        id: changelog
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          body="Release $tag"
          echo "body=$body" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: artifacts/zed-config-*
          fail_on_unmatched_files: true
