[package]
name = "zed-config-sync"
version = "0.3.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "zed-config"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
dirs = "5"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
anyhow = "1"
zip = "2"
chrono = "0.4"
base64 = "0.22"
